<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Wishes</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/confetti.css">
    <!-- <link rel="stylesheet" href="assets/css/firework.css"> -->
</head>

<body>
    <!-- Achtergrond afbeelding -->
    <div class="bg-image-container">
        <img id="bgImage" src="assets/images/default.jpg" alt="background">
    </div>

    <!-- Confetti container -->
    <div class="confetti-container"></div>

    <!-- Container -->
    <div class="container" id="messageContainer">
        <h1>Happy Birthday!</h1>
        <div id="wishMessage"></div>
    </div>

    <script>
        window.onload = function () {
            const params = new URLSearchParams(window.location.search);
            const celebrant = params.get('celebrant')?.trim();
            const wisher = params.get('wisher')?.trim();
            const personalWish = params.get('personalWish')?.trim();
            const position = params.get('position') || 'bottom';

            const containerDiv = document.getElementById('messageContainer');
            const wishMessageDiv = document.getElementById('wishMessage');
            const bgImage = document.getElementById('bgImage');

            containerDiv.className = `container ${position}`;

            if (celebrant && wisher) {

                const celebrantLower = celebrant.toLowerCase();
                const wisherLower = wisher.toLowerCase();

                let message = '';
                let backgroundImage = 'assets/images/default.jpg';
                let bgFit = 'fit';

                // Combinaties
                if (celebrantLower === 'liam' && wisherLower === 'peetje') {
                    message = `${wisher} wenst je een fantastische verjaardag, ${celebrant}! 🎉🎂`;
                    backgroundImage = 'assets/images/spiderman.jpg';
                    bgFit = 'cover';

                } else if (celebrantLower === 'mila' && wisherLower === 'meetje') {
                    message = `${wisher} wenst je een fantastische verjaardag, ${celebrant}! 🎉🎂`;
                    backgroundImage = 'assets/images/stitch.jpg';
                    bgFit = 'cover';

                } else if (celebrantLower === 'maikel' && wisherLower === 'keibeck-beinsberger') {
                    message = `Familie ${wisher} wensen je een fantastische verjaardag, ${celebrant}! 🎉🎂 HIEP, HIEP, HOERA 🦆🥳`;
                    backgroundImage = 'assets/images/Soccer.jpg';
                    bgFit = 'fill';

                } else if (celebrantLower === 'jenny' && wisherLower === 'keibeck-beinsberger') {
                    message = `Familie ${wisher} wensen je een fantastische verjaardag, ${celebrant}! 🎉🎂 HIEP, HIEP, HOERA 🦆🥳`;
                    backgroundImage = 'assets/images/stokstaartje.jpg';
                    bgFit = 'fill';

                } else if (celebrantLower === 'chiara' && wisherLower === 'papa') {
                    message = `${wisher} wenst je een fantastische verjaardag, ${celebrant}! 🎉🎂`;
                    backgroundImage = 'assets/images/AISelect_20251221_220223_Chrome.jpg';
                    bgFit = 'cover';

                } else if (celebrantLower === 'nathalie' && wisherLower === 'papa') {
                    message = `${wisher} wenst je een fantastische verjaardag, ${celebrant}! 🎉🎂`;
                    backgroundImage = 'assets/images/nathalie_16.png';
                    bgFit = 'cover';

                } else {
                    message = `${wisher} wishes you a wonderful birthday, ${celebrant}! 🎉🎂`;
                    backgroundImage = getBackgroundImage(celebrantLower);
                    bgFit = 'cover';
                }

                // Bericht maken
                const wishMessage = document.createElement('div');
                wishMessage.classList.add('wishMessage');

                const h2 = document.createElement('h2');
                h2.innerText = message;

                // 👉 FIX: Nathalie + papa → h2 rood
                if (celebrantLower === 'nathalie' && wisherLower === 'papa') {
                    h2.style.color = 'blue';
                }

                wishMessage.appendChild(h2);

                if (personalWish) {
                    const personalMessage = document.createElement('p');
                    personalMessage.classList.add('personalMessage');
                    personalMessage.innerText = `"${decodeURIComponent(personalWish)}"`;

                    // 👉 FIX: Nathalie + papa → personal message geel
                    if (celebrantLower === 'nathalie' && wisherLower === 'papa') {
                        personalMessage.style.color = 'blue';
                    }

                    wishMessage.appendChild(personalMessage);
                }

                wishMessageDiv.appendChild(wishMessage);

                // Achtergrond
                bgImage.src = backgroundImage;
                bgImage.style.objectFit = bgFit;

                if (bgFit === 'cover') {
                    bgImage.style.objectPosition = 'center center';
                } else {
                    bgImage.style.objectPosition = '0 0';
                }

            } else {
                alert('Voer de namen van jarige en wisher in!');
            }

            function getBackgroundImage(name) {
                switch (name) {
                    case 'john': return 'assets/images/john.jpg';
                    case 'sarah': return 'assets/images/sarah.jpg';
                    case 'sylvia': return 'assets/images/sylvia.jpg';
                    default: return 'assets/images/default.jpg';
                }
            }

            function generateConfetti() {
                const container = document.querySelector('.confetti-container');
                const numConfetti = 100;

                for (let i = 0; i < numConfetti; i++) {
                    const confetti = document.createElement('div');
                    confetti.classList.add('confetti');
                    confetti.style.left = `${Math.random() * window.innerWidth}px`;
                    confetti.style.animationDuration = `${Math.random() * 2 + 2}s`;
                    confetti.style.animationDelay = `${Math.random() * 2}s`;
                    container.appendChild(confetti);
                }
            }

            generateConfetti();
        }
    </script>

    <script src="assets/js/firework.js"></script>
</body>
</html>
